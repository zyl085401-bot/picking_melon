  papjia_studio_flask:
    container_name: papjia_studio_flask
    image: papjia-docker.pkg.coding.net/papjia_mobile_manipulator/melon/papjia_melon:latest
    # 内存限制
    mem_limit: 4g  # 最大内存限制
    mem_reservation: 2g  # 最小内存保证
    memswap_limit: 6g  # 最大内存+交换空间限制
    network_mode: "host"
    ipc: host
    privileged: true
    volumes:
      - ../../app:/workspace/src/app
      - ../../drivers:/workspace/src/drivers
      - ../../robots:/workspace/src/robots
      - ../../tools:/workspace/src/tools
      - ../../papjia_melon:/workspace/src/papjia_melon
    environment:
      - ROS_DOMAIN_ID=7
      - TZ=Asia/Shanghai
      - WAYPOINT_CONFIG_FILEPATH=/workspace/src/papjia_melon/papjia_melon_config/config/waypoint_configs.json
      - ACTION_MODEL_CONFIG_FILEPATH=/workspace/src/papjia_melon/papjia_melon_config/config/action_model.yaml
    command: bash -c "cd /workspace/src/app/papjia_config_manage && chmod +x start.sh && ./start.sh"

  papjia_studio_web:
    # 内存限制
    mem_limit: 2.5g  # 最大内存限制
    mem_reservation: 1g  # 最小内存保证
    memswap_limit: 3.5g  # 最大内存+交换空间限制
    container_name: papjia_studio_web
    image: papjia-docker.pkg.coding.net/papjia_mobile_manipulator/melon/papjia_studio_web:melon
    working_dir: /app
    network_mode: "host"