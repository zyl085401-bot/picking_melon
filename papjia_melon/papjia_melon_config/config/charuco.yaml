camera_base_charuco_detector:
  ros__parameters:
    charuco_parameters:
      squaresSidesSizeM: 0.025
      markersSidesSizeM: 0.018
      numberOfBitsForMarkersSides: 4
      numberOfMarkers: 17
      numberOfSquaresInX: 7
      numberOfSquaresInY: 5
      dictionaryId: 1
      adaptiveThreshWinSizeMin: 3
      adaptiveThreshWinSizeMax: 23
      adaptiveThreshWinSizeStep: 10
      adaptiveThreshConstant: 7.0
      minMarkerPerimeterRate: 0.03
      maxMarkerPerimeterRate: 4.0
      polygonalApproxAccuracyRate: 0.03
      minCornerDistanceRate: 0.05
      minDistanceToBorder: 3
      minMarkerDistanceRate: 0.05
      cornerRefinementMethod: 0
      cornerRefinementWinSize: 5
      cornerRefinementMaxIterations: 30
      cornerRefinementMinAccuracy: 0.1
      markerBorderBits: 1
      perspectiveRemovePixelPerCell: 4
      perspectiveRemoveIgnoredMarginPerCell: 0.13
      maxErroneousBitsInBorderRate: 0.35
      minOtsuStdDev: 5.0
      errorCorrectionRate: 0.6
      aprilTagMinClusterPixels: 5
      aprilTagMaxNmaxima: 10
      aprilTagCriticalRad: 0.17453292519
      aprilTagMaxLineFitMse: 10.0
      aprilTagMinWhiteBlackDiff: 5
      aprilTagDeglitch: 0
      aprilTagQuadDecimate: 0.0
      aprilTagQuadSigma: 0.0
      detectInvertedMarker: false
    function_parameters:
      use_median_blur: false
      median_blur_k_size: 6
      use_dynamic_range: true
      use_bilateral_filter: false
      bilateral_filter_pixel_neighborhood: 5
      bilateral_filter_sigma_color: 100.0
      bilateral_filter_sigma_space: 100.0
      bilateral_filter_border_type: 4
      use_clahe: true
      clahe_clip_limit: 1.0
      clahe_size_x: 2
      clahe_size_y: 2
      use_adaptive_threshold: false
      adaptive_threshold_max_value: 255.0
      adaptive_threshold_method: 1
      adaptive_threshold_type: 0
      adaptive_threshold_block_size: 65
      adaptive_threshold_constant_offset_from_mean: 0.0
    tf_parameters:
      use_static_tf_broadcaster: true
      tf_broadcaster_republish_rate: 10.0
      sensor_frame_override: "camera_base_color_optical_frame"
      charuco_tf_frame: charuco_camera_base

    subscribers:
      image_topic:
        topic: /camera/camera_base/color/image_raw
        queue_size: 1
      camera_info:
        topic: /camera/camera_base/aligned_depth_to_color/camera_info
        queue_size: 1

    publishers:
      image_results_publisher:
        topic: /camera/camera_base/color/charuco
        queue_size: 1
        latch: false
      charuco_pose_publisher:
        topic: /camera/camera_base/color/charuco/pose
        queue_size: 1
        latch: false


